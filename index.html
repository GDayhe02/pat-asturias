        <style>

            background-color: #ffffff;

            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {

        <style>
        html, body, #map {

            height: 100%;

            margin: 0;

        #map-logos {
            position: absolute;
            right: 12px;
            bottom: 34px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 4px;
            pointer-events: none;
        }
        #map-logos img {
            display: block;
            width: auto;
            height: auto;
            max-width: 160px;
            max-height: 42px;
            object-fit: contain;
        }
        @media (max-width: 600px) {
            #map-logos {
                right: 8px;
                bottom: 30px;
                gap: 6px;
                padding: 4px 6px;
            }
            #map-logos img {
                max-width: 110px;
                max-height: 32px;
            }
        }
